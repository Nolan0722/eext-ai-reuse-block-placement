<!doctype html>
<!--
  复用模块 AI 对话助手（chat.html）
  · 双模：无桥时 mock（浏览器预览）；EDA iframe 内走 eda.ai_reuse_block_placement.chatTurn
  · 写画布 / 写库 / 导出必须经确认卡
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>复用模块 AI 助手</title>
<style>
  /* ── 设计令牌：对齐 jlc-work-stage 原型（品牌蓝点缀 + 亮/暗双主题）── */
  :root{
    --blue:#4f7fff; --blue-2:#3868ee;
    --blue-soft:#4f7fff38; --blue-soft-hover:#4f7fff5c; --blue-line:#4f7fff66;
    --bg:#f5f5f5; --panel:#ffffff; --panel-2:#fafafa; --input:#ffffff;
    --well:#7373731f; --hover:#73737314; --selected:#7373731f;
    --text:#171717; --text-2:#404040; --text-3:#646464; --meta:#a1a1a1;
    --line:#7373731f; --line-2:#7373732e; --line-3:#7373735c;
    --green:#23a55a; --green-soft:#23a55a1f;
    --amber:#a97a10; --amber-soft:#f0b23229; --amber-line:#f0b23266;
    --red:#da373c; --red-soft:#da373c14;
    --code-bg:#0f172a; --code-fg:#e2e8f0;
    --shadow:0 3px 9px 0 #1818180f;
    --radius:12px; --radius-sm:8px;
    --font:"SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,
           "PingFang SC","Microsoft YaHei","Hiragino Sans GB",Roboto,sans-serif;
    color-scheme:light;
  }
  [data-theme="dark"]{
    --blue-soft:#4f7fff38; --blue-soft-hover:#4f7fff5c; --blue-line:#4f7fff73;
    --bg:#171717; --panel:#262626; --panel-2:#1d1d1d; --input:#262626;
    --well:#ffffff14; --hover:#ffffff0f; --selected:#ffffff1a;
    --text:#ededed; --text-2:#c9c9c9; --text-3:#9c9c9c; --meta:#8a8a8a;
    --line:#ffffff14; --line-2:#ffffff24; --line-3:#ffffff47;
    --green:#23a55a; --green-soft:#23a55a24;
    --amber:#f0b232; --amber-soft:#f0b23224; --amber-line:#f0b23247;
    --red:#f23f43; --red-soft:#f23f431f;
    --shadow:0 3px 9px 0 #00000047;
    color-scheme:dark;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font:13px/1.6 var(--font);
    color:var(--text); background:var(--bg);
    transition:background-color .18s ease, color .18s ease;
  }
  #app{display:flex; flex-direction:column; height:100vh;
       background:var(--panel);}
  header{
    display:flex; align-items:center; gap:8px; padding:0 8px 0 14px; height:46px;
    border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5; flex:none;
  }
  /* 扁平线性图标按钮（设置 / 主题），与工具行 SVG 同一视觉语言 */
  .icon-btn{width:30px; height:30px; flex:none; border:none; border-radius:8px;
    background:none; cursor:pointer; color:var(--text-3);
    display:flex; align-items:center; justify-content:center;
    transition:background .16s ease, color .16s ease;}
  .icon-btn svg{display:block; width:17px; height:17px;}
  .icon-btn:hover{background:var(--hover); color:var(--text);}
  .icon-btn.on{color:var(--blue); background:var(--blue-soft);}
  #hdBtns{display:flex; align-items:center; gap:2px; flex:none; margin-left:auto;}
  /* 右上角状态 chip：常态（真桥 + 模型已配置）不显示，仅异常时出现 */
  .status{display:none; align-items:center; gap:6px; font-size:12px; padding:3px 10px;
    border-radius:12px; white-space:nowrap;}
  .status.show{display:flex;}
  .status.warn{background:var(--amber-soft); color:var(--amber);}
  .status.click{cursor:pointer;}
  .status.click:hover{background:var(--amber-line);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none;}
  main{flex:1; min-height:0; display:flex; flex-direction:column;}
  .page{flex:1; min-height:0; display:none; flex-direction:column;}
  .page.on{display:flex;}
  #msgList{flex:1; overflow-y:auto; padding:0 16px 6px; scrollbar-width:none;}
  #msgList::-webkit-scrollbar{display:none;}
  /* 消息分段：每条用户消息开启一段，用户气泡在段内滚动吸顶，直至被下一条用户消息顶替 */
  .seg{display:flex; flex-direction:column; min-width:0;}
  .col{display:flex; flex-direction:column; margin-bottom:14px; min-width:0;}
  .col.user{align-items:stretch; position:sticky; top:0; z-index:5;
    background:var(--panel); padding:0 0 6px; margin-bottom:8px;}
  .col.ai{align-items:stretch;}
  /* 首段以 AI 内容开头时（欢迎语/状态提示）给顶部留一点呼吸，用户气泡开头则贴住 header */
  .seg:first-child .col.ai:first-child, .seg:first-child .sysnote:first-child{ padding-top:12px; }
  .bubble{width:100%; padding:9px 13px; border-radius:12px; word-break:break-word;}
  /* 用户气泡可点击：收起/展开（展开态由 JS 渲染全文，收起态由 JS 只渲染首个逻辑行） */
  .bubble.user{background:var(--selected); color:var(--text); border:1px solid var(--line-3); cursor:pointer;}
  .bubble.user:hover{border-color:var(--blue-line);}
  /* 用户气泡收起态：单行省略。首个逻辑行由 JS 截取，此处仅负责单行内超宽的截断显示
     （nowrap+ellipsis，不依赖 -webkit-line-clamp，规避内核差异） */
  .bubble.user.fold{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .ai-body b{color:inherit; font-weight:700;}
  .caret{display:inline-block;width:7px;height:14px;background:var(--blue);
    vertical-align:-2px; margin-left:2px; animation:blink 1s steps(2) infinite;}
  @keyframes blink{50%{opacity:0;}}
  /* ── AI 消息富文本（Markdown-lite）：全宽 · 无气泡包裹 ── */
  .ai-body{width:100%; word-break:break-word;}
  .ai-body p{margin:0;}
  .ai-body h1,.ai-body h2,.ai-body h3{font-size:13.5px; margin:8px 0 4px; line-height:1.5;}
  .ai-body h1{font-size:14.5px;}
  .ai-body ul,.ai-body ol{margin:4px 0; padding-left:20px;}
  .ai-body li{margin:2px 0;}
  .ai-body ul ul,.ai-body ol ol,.ai-body ul ol,.ai-body ol ul{margin:2px 0;}
  .ai-body pre.md-code{background:var(--code-bg); color:var(--code-fg); border-radius:8px; padding:8px 11px;
    margin:6px 0; overflow-x:auto; white-space:pre;}
  .ai-body pre.md-code code{font:11.5px/1.6 Consolas,Menlo,monospace; color:inherit; background:none; padding:0; border:none;}
  .ai-body pre.md-code[data-lang]::before{content:attr(data-lang); display:block; font-size:10px;
    color:var(--meta); margin-bottom:4px; letter-spacing:.05em;}
  .ai-body code.md-inline{background:var(--well); border:1px solid var(--line); border-radius:4px;
    padding:0 4px; font:11.5px Consolas,Menlo,monospace; color:var(--text);}
  .ai-body blockquote{border-left:3px solid var(--line-3); background:var(--well);
    padding:4px 10px; margin:6px 0; border-radius:0 6px 6px 0; color:var(--text-2);}
  .ai-body hr{border:none; border-top:1px dashed var(--line); margin:8px 0;}
  .ai-body a{color:var(--text); text-decoration:underline;}
  .ai-body s{color:var(--text-3);}
  .ai-body table.md-table{border-collapse:collapse; font-size:12px; margin:6px 0; max-width:100%;}
  .ai-body table.md-table th,.ai-body table.md-table td{border:1px solid var(--line); padding:3px 8px; text-align:left;}
  .ai-body table.md-table th{background:var(--panel-2); font-weight:600;}
  .sysnote{text-align:center; color:var(--text-3); font-size:12px; margin:10px 0;}
  /* 工具调用：运行中「⟳ Working for Xs · 工具名」（旋转 + 闪烁），结束 Worked for Xs；
     右侧箭头展开详情 */
  .tool{width:100%; max-width:100%; margin-bottom:2px;}
  .tool-line{display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    color:var(--text-3); font-size:12.5px; line-height:1.4; padding:3px 0; width:100%;}
  .tool-line:hover{color:var(--text-2);}
  .tool.running .tool-label{animation:tool-pulse 1.4s ease-in-out infinite;}
  .tool.running .tool-line{color:var(--text-2);}
  @keyframes tool-pulse{0%,100%{opacity:1;}50%{opacity:.45;}}
  /* ── 思维链（reasoning）折叠块：默认展开跟随流出，结束后自动收起 ── */
  .tool.reasoning{cursor:pointer;}
  .tool.reasoning .tool-line{color:var(--text-3);}
  .tool.reasoning .tool-label{font-style:normal;}
  .reasoning-stream{display:none; padding:2px 0 4px 19px; color:var(--text-3); font-size:12.5px; line-height:1.55; white-space:pre-wrap; word-break:break-word;}
  .tool.reasoning.open .reasoning-stream{display:block;}
  .tool-line .tool-label{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  /* 整轮计时组：展开显示本轮工具行，收起隐藏 */
  .tool .tool-sub{display:none; flex-direction:column; padding-left:19px;}
  .tool.work.open .tool-sub{display:flex;}
  /* 固定正方形盒：箭头居中于盒内，旋转以盒中心为原点，展开时不会横向漂移 */
  .tool-line .tool-caret{flex:0 0 14px; width:14px; height:14px; display:block;
    transform-origin:50% 50%; transition:transform .15s ease;}
  .tool-line .tool-caret svg{display:block; width:14px; height:14px; overflow:visible;}
  .tool.open > .tool-line .tool-caret{transform:rotate(90deg);}
  .tool-detail{display:none; margin:2px 0 6px; padding:8px 11px;
    font:11px/1.5 Consolas,Menlo,monospace; color:var(--text-2); white-space:pre-wrap; word-break:break-all;
    max-height:180px; overflow-y:auto; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;}
  .tool-detail:empty{display:none !important;}
  .tool.open > .tool-detail{display:block;}
  .card{
    width:100%; max-width:100%; border:1px solid var(--line); border-radius:16px;
    background:var(--panel); box-shadow:var(--shadow); overflow:hidden;
  }
  /* 统一卡头：图标 + 标题 + 可折叠详情箭头（Claude/Cursor 式卡片语言） */
  .card-hd{display:flex; align-items:center; gap:9px; padding:12px 14px; font-weight:600; font-size:12.5px;
    cursor:pointer; user-select:none;}
  .card-hd .caret-box{flex:0 0 14px; width:14px; height:14px; color:var(--text-3);
    transition:transform .15s ease; transform-origin:50% 50%;}
  .card.open .card-hd .caret-box{transform:rotate(90deg);}
  .card-hd .caret-box svg{display:block; width:14px; height:14px; overflow:visible;}
  .card-hd .hd-status{margin-left:auto; font-size:11px; font-weight:500; flex:none;}
  .card-bd{padding:2px 14px 12px;}
  .card-foot{display:flex; align-items:center; gap:8px; padding:10px 14px 14px;}
  .card-foot .spacer{flex:1;}
  .card .hint{font-size:11.5px; color:var(--text-3); margin-top:6px;}
  .card.dead{opacity:.45; pointer-events:none;}
  .card.dead .hd-status{color:var(--red);}
  .card.dead .hd-status::after{content:"已作废";}
  .card.done{opacity:.75; pointer-events:none;}
  .card.done .hd-status{color:var(--green);}
  .card.done .hd-status::after{content:"已处理";}
  .card.risk{opacity:.72;}
  /* 卡头点击折叠：默认 open，收起时隐藏正文与详情，只留标题行 */
  .card-detail{margin:0 14px 12px; padding:8px 10px; font:11px/1.5 Consolas,Menlo,monospace; color:var(--text-2);
    white-space:pre-wrap; word-break:break-all; background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    max-height:180px; overflow-y:auto;}
  .card:not(.open) .card-bd, .card:not(.open) .card-detail{display:none;}
  /* 卡内模块清单：限高内滚（滚到边缘后原生滚动链带动外层会话滚动） */
  .pick-list{max-height:340px; overflow-y:auto; scrollbar-width:thin; scrollbar-color:var(--line-3) transparent;}
  .pick-list::-webkit-scrollbar{width:8px;}
  .pick-list::-webkit-scrollbar-thumb{background:var(--line-3); border-radius:4px;}
  /* 卡内逐项行（Claude/Cursor 式 item 行）：紧凑单行 = 勾选框 + 名称 + 来源 + 说明（超长省略，整行悬停看全文）+ 右侧控件 */
  .pick-item{display:flex; align-items:center; gap:9px; padding:5px 10px; border:1px solid var(--line);
    border-radius:10px; margin-bottom:4px; background:var(--panel-2);}
  .pick-item input[type=checkbox]{flex:none;}
  .pick-item .pi-main{flex:1; min-width:0;}
  .pick-item .pi-title{font-weight:600; font-size:12.5px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .pick-item .pi-name{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pick-item .pi-reason{color:var(--text-3); font-size:11px; font-weight:400; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:2;}
  .pick-item .pi-ctrls{flex:none; display:flex; gap:6px; margin-left:auto; justify-content:flex-end; flex-wrap:wrap;}
  .pick-item select, .pick-item input[type=number]{
    padding:5px 9px; border:1px solid var(--line); border-radius:7px; font-size:12.5px;
    background:var(--panel); color:var(--text-2); max-width:150px;}
  .pick-item select:disabled{opacity:.45;}
  .pick-src{color:var(--text-3); font-size:11px;}
  .btn{
    padding:5px 14px; border-radius:7px; border:1px solid var(--line-3); background:var(--panel);
    cursor:pointer; font-size:12.5px; color:var(--text);
  }
  .btn:hover{border-color:var(--blue); color:var(--blue);}
  .btn.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:500;}
  .btn.primary:hover{background:var(--blue-2); color:#fff;}
  .btn.danger{background:var(--red); border-color:var(--red); color:#fff; font-weight:500;}
  .btn.danger:hover{filter:brightness(.92); color:#fff; border-color:var(--red);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.link{border:none; background:none; color:var(--blue); padding:2px 4px; text-decoration:underline;}
  /* ── 空会话首屏（Gemini 风格）：大字问候 + 建议选项（复用 chips 点击逻辑），首条消息后隐藏 ── */
  #hero{display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; flex:1; min-height:0; padding:24px 16px; text-align:center;}
  #page-chat.empty #hero{display:flex;}
  #page-chat.empty #msgList{display:none;}
  .hero-greet{font-size:30px; line-height:1.45; font-weight:700; color:var(--text-3); letter-spacing:.5px;}
  .hero-greet b{font-weight:700; color:var(--blue);}
  .hero-sub{font-size:13px; line-height:1.7; color:var(--text-3); max-width:480px;}
  #chips{display:flex; flex-wrap:wrap; justify-content:center; gap:9px; max-width:620px;}
  /* 对话中的建议条：横滑（恢复原样式），空会话首屏显示时不出现 */
  #chipsBar{flex:none; display:flex; gap:8px; padding:6px 16px; overflow-x:auto; scrollbar-width:none;}
  #chipsBar::-webkit-scrollbar{display:none;}
  #page-chat.empty #chipsBar{display:none;}
  .chip{flex:none; padding:6px 14px; border:1px solid var(--line); border-radius:10px;
    background:var(--panel); font-size:12.5px; color:var(--text-2); cursor:pointer;}
  .chip:hover{border-color:var(--blue); color:var(--blue);}
  #composer{flex:none; padding:8px 16px 14px;}
  /* 输入框：外层圆角容器（对齐 jlc-work-stage 原型 .composer），底色/描边对齐用户气泡，默认单行高 */
  .composer-box{border:1px solid var(--line-3); background:var(--selected); border-radius:16px;
    transition:border-color .16s ease; overflow:hidden;}
  .composer-box:focus-within{border-color:var(--blue-line);}
  #input{
    display:block; width:100%; max-height:132px; resize:none;
    background:none; border:none; outline:none;
    padding:10px 14px; font:13px/20px inherit; font-family:inherit; color:var(--text);
  }
  #input::placeholder{color:var(--meta);}
  .composer-foot{display:flex; align-items:center; gap:6px; min-height:40px; padding:4px 8px 8px 14px;}
  .composer-foot .spacer{flex:1;}
  .composer-hint{font-size:11px; color:var(--meta); user-select:none;}
  .composer-hint b{font-weight:500; color:var(--text-3);}
  #send{flex:none; width:32px; height:32px; padding:0; border:none; border-radius:8px;
    background:var(--blue-soft); color:var(--blue); cursor:pointer;
    display:grid; place-items:center; transition:background .16s ease, color .16s ease;}
  #send svg{display:block; width:16px; height:16px;}
  #send:not(:disabled){background:var(--blue); color:#fff;}
  #send:not(:disabled):hover{background:var(--blue-2);}
  #send:disabled{cursor:not-allowed;}
  /* 停止态：红色方块按钮（发送中点击 = 中止本轮） */
  #send.stopping{background:var(--red); color:#fff;}
  #send.stopping:hover{background:#c22c31;}
  #page-settings{overflow:hidden; padding:8px 10px 6px; display:none; gap:6px;}
  #page-settings.on{display:flex; flex-direction:column;}
  .settings-grid{flex:1; min-height:0; display:grid; grid-template-columns:1fr 1fr;
    grid-template-rows:auto auto minmax(0,1fr); gap:8px; align-items:stretch;}
  .sec{border:1px solid var(--line); border-radius:var(--radius); background:var(--panel);
    margin-bottom:0; overflow:hidden; display:flex; flex-direction:column; min-height:0;}
  /* 设置页网格：左列 = 放置排布 + 模块库目录（上下两格），右列 = 系统提示词纵向跨两格与之并列 */
  #secPlacement{grid-column:1; grid-row:2;}
  #secSys{grid-column:2; grid-row:2 / 4;}
  #secCatalog{grid-column:1; grid-row:3; min-height:0;}
  .sec-hd{padding:6px 12px; font-weight:600; font-size:12.5px; background:var(--panel-2); border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:8px; flex:none;}
  .sec-bd{padding:8px 10px; min-height:0;}
  #secCatalog .sec-bd{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  #secCatalog .pnote,
  #secCatalog .frow,
  #secCatalog .opresult{flex:none;}
  .frow{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .frow label{width:72px; flex:none; color:var(--text-2); font-size:12px; text-align:right;}
  .frow .fctl{flex:1; min-width:0; display:flex; align-items:center; gap:8px;}
  .frow input[type=text], .frow input[type=password], .frow select{
    flex:1; padding:6px 10px; border:1px solid var(--line); border-radius:7px;
    font:12.5px/1.5 inherit; font-family:inherit; min-width:0; outline:none;}
  .frow input:focus{border-color:var(--blue);}
  /* 放置排布：紧凑双行网格（间距 + 标注框三参数） */
  .prow{display:flex; align-items:center; flex-wrap:wrap; gap:6px 14px; margin-bottom:9px;}
  .plabel{flex:none; width:60px; color:var(--text-2); font-size:12.5px;}
  .pitem{display:inline-flex; align-items:center; gap:5px; font-size:12px; color:var(--text-3);}
  .pitem input{width:64px; padding:4px 8px; border:1px solid var(--line); border-radius:6px;
    font-size:12px; background:var(--panel); color:var(--text); outline:none;}
  .pitem input:focus{border-color:var(--blue);}
  .pitem input[type=text]{width:96px;}
  .punit{font-size:11px; color:var(--meta);}
  .pnote{font-size:11px; color:var(--meta); margin-top:2px;}
  /* 系统提示词：填满跨两格的区块高度，输入框随区块伸缩，禁用手动调高 */
  #secSys .sec-bd{flex:1; display:flex; flex-direction:column; overflow:hidden;}
  #secSys .sec-bd > .frow, #secSys .opresult{flex:none;}
  #setStyle{width:100%; flex:1; min-height:64px; resize:none; box-sizing:border-box; margin:0 0 6px; padding:6px 8px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text);
    font:12.5px/1.55 Consolas,Menlo,monospace; outline:none;}
  #setStyle:focus{border-color:var(--blue);}
  .note{font-size:11.5px; color:var(--text-3); margin:2px 0 10px; padding-left:98px;}
  .note.flush{padding-left:0;}
  /* 目录库行：名称 + 模块数 / 可见性勾选 */
  .scoperow{display:flex; align-items:center; gap:8px; padding:4px 8px; border:1px solid var(--line);
    border-radius:8px; margin-bottom:4px; background:var(--panel-2);}

  .import-block ul{margin:0; padding-left:18px;}
  .import-policy{display:flex; flex-direction:column; gap:8px; margin:10px 0; font-size:12.5px;}
  .import-policy label{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px;}
  .import-policy select{padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); font:inherit;}
  .scope-badge{flex:none; font-size:11px; padding:2px 8px; border-radius:8px; font-weight:500;}
  .scope-badge.ok{color:var(--green); background:var(--green-soft);}
  .scope-badge.bad{color:var(--red); background:var(--red-soft);}
  .opresult{font-size:12px; margin-top:4px; padding:7px 11px; border-radius:7px; display:none;}

  .opresult.err{display:block; background:var(--red-soft); color:var(--red);}
  .opresult.wait{display:block; background:var(--amber-soft); color:var(--text-2);}
  pre.diag{font:11px/1.6 Consolas,Menlo,monospace; background:var(--panel-2); border:1px solid var(--line);
    border-radius:7px; padding:10px; white-space:pre-wrap; word-break:break-all; display:none; margin-top:8px;}

  function renderUserBubble(b, folded) {

    if (folded) {
      const norm = raw.replace(/\r\n?/g, '\n');

  /* ── 富文本渲染（Markdown-lite：标题/列表/代码块/行内码/表格/引用/链接）──
     先整体转义 HTML 再施加标记，模型输出永不以 HTML 注入。 */
  function escHtml(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }
  function inlineFmt(text) {
    let t = escHtml(text);
    t = t.replace(/`([^`\n]+)`/g, (m, c) => `<code class="md-inline">${c}</code>`);
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<i>$2</i>');
    t = t.replace(/~~([^~\n]+)~~/g, '<s>$1</s>');
    t = t.replace(/\[([^\]\n]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  function splitRow(line) {
    return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
  }
  function wrapList(items) {
    const tag = items[0].ordered ? 'ol' : 'ul';
    return `<${tag}>${items.map(it => `<li>${inlineFmt(it.text)}</li>`).join('')}</${tag}>`;
  }
  function mdBlock(src) {
    const lines = String(src).split('\n');
    let html = '';
    let para = [];
    let i = 0;
    const flushPara = () => {
      if (para.length) html += `<p>${para.map(inlineFmt).join('<br>')}</p>`;
      para = [];
    };
    while (i < lines.length) {
      const line = lines[i];
      const trimmed = line.trim();
      if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flushPara();
        const header = splitRow(line);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        html += `<table class="md-table"><thead><tr>${header.map(c => `<th>${inlineFmt(c)}</th>`).join('')}</tr></thead><tbody>`
          + rows.map(r => `<tr>${r.map(c => `<td>${inlineFmt(c)}</td>`).join('')}</tr>`).join('') + '</tbody></table>';
        continue;
      }
      if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) { flushPara(); html += '<hr>'; i++; continue; }
      const h = trimmed.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        flushPara();
        const lv = Math.min(h[1].length, 3);
        html += `<h${lv}>${inlineFmt(h[2])}</h${lv}>`;
        i++; continue;
      }
      if (/^>\s?/.test(trimmed)) {
        flushPara();
        const q = [];
        while (i < lines.length && /^>\s?/.test(lines[i].trim())) { q.push(lines[i].trim().replace(/^>\s?/, '')); i++; }
        html += `<blockquote>${q.map(inlineFmt).join('<br>')}</blockquote>`;
        continue;
      }
      const li = line.match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
      if (li) {
        flushPara();
        const items = [];
        while (i < lines.length) {
          const m2 = lines[i].match(/^(\s*)([-*]|\d+[.)])\s+(.*)$/);
          if (!m2) break;
          items.push({ indent: m2[1].length, ordered: /\d/.test(m2[2]), text: m2[3] });
          i++;
        }
        let idx = 0;
        while (idx < items.length) {
          const it = items[idx];
          if (it.indent >= 2) {
            const group = [];
            while (idx < items.length && items[idx].indent >= 2) { group.push(items[idx]); idx++; }
            html += wrapList(group);
            continue;
          }
          const ordered = it.ordered;
          const tag = ordered ? 'ol' : 'ul';
          const rows = [];
          let inner = `<li>${inlineFmt(it.text)}`;
          idx++;
          const kids = [];
          while (idx < items.length && items[idx].indent >= 2) { kids.push(items[idx]); idx++; }
          if (kids.length) inner += wrapList(kids);
          inner += '</li>';
          rows.push(inner);
          while (idx < items.length && items[idx].indent < 2 && items[idx].ordered === ordered) {
            let inner2 = `<li>${inlineFmt(items[idx].text)}`;
            idx++;
            const kids2 = [];
            while (idx < items.length && items[idx].indent >= 2) { kids2.push(items[idx]); idx++; }
            if (kids2.length) inner2 += wrapList(kids2);
            inner2 += '</li>';
            rows.push(inner2);
          }
          html += `<${tag}>${rows.join('')}</${tag}>`;
        }
        continue;
      }
      if (trimmed === '') { flushPara(); i++; continue; }
      para.push(line);
      i++;
    }
    flushPara();
    return html;
  }
  function mdRich(src) {
    const parts = String(src).split('```');
    let html = '';
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        let code = parts[i];
        let lang = '';
        const nl = code.indexOf('\n');
        if (nl >= 0) {
          const first = code.slice(0, nl).trim();
          if (/^[\w.+-]*$/.test(first)) { lang = first; code = code.slice(nl + 1); }
        }
        html += `<pre class="md-code"${lang ? ` data-lang="${escHtml(lang)}"` : ''}><code>${escHtml(code.replace(/\n$/, ''))}</code></pre>`;
      }
      else {
        html += mdBlock(parts[i]);
      }
    }
    return html;
  }
  async function streamAi(text, speed) {
    speed = speed || 2;
    const b = addAiBubble();
    const caret = document.createElement('span'); caret.className = 'caret';
    b.el.after(caret);
    for (let i = 0; i < text.length; i += speed) {
      b.text += text.slice(i, i + speed);
      b.el.innerHTML = mdRich(b.text); scrollBottom();
      await sleep(18);
    }
    b.el.innerHTML = mdRich(text); caret.remove(); scrollBottom();
    return b;
  }
  /* 整轮工作计时（从消息发出起算）：运行中「⟳ Working for Xs」（旋转+闪烁），
     结束「Worked for Xs」；展开显示本轮各工具行，收起时不显示 */
  function addWorkTimer() {
    const el = document.createElement('div'); el.className = 'tool work running open';
    el.innerHTML = `
      <div class="tool-line">
        <span class="tool-label"></span>
        <span class="tool-caret" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M5 3.5 L9 7 L5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="tool-sub"></div>`;
    ensureSeg().appendChild(el);
    const label = el.querySelector('.tool-label');
    const t0 = Date.now();
    const elapsed = () => Math.floor((Date.now() - t0) / 1000);
    label.textContent = `Working for ${elapsed()}s`;
    const timer = setInterval(() => { label.textContent = `Working for ${elapsed()}s`; }, 1000);
    return {
      body: el.querySelector('.tool-sub'),
      done() {
        clearInterval(timer);
        el.classList.remove('running'); el.classList.remove('open'); el.classList.add('ok');
        label.textContent = `Worked for ${elapsed()}s`;
      },
    };
  }
  function addToolBubble(name, argsSummary, parentEl) {
    const el = document.createElement('div'); el.className = 'tool';
    el.innerHTML = `
      <div class="tool-line">
        <span class="tool-label">Running ${esc(name)}</span>
        <span class="tool-caret" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M5 3.5 L9 7 L5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="tool-detail"></div>`;
    (parentEl || ensureSeg()).appendChild(el);
    const label = el.querySelector('.tool-label');
    const detail = el.querySelector('.tool-detail');
    let argsText = argsSummary || '';
    let argsJson = '';
    function fill(payload) {
      const parts = [];
      if (argsText) parts.push(argsText);
      if (argsJson) parts.push(`入参: ${argsJson}`);
      if (payload !== undefined) parts.push(`结果: ${typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2)}`);
      detail.textContent = parts.join('\n');
    }
    scrollBottom();
    if (argsSummary) detail.textContent = String(argsSummary); /* 运行中即可展开看参数 */
    return {
      /* 模型真实入参（后端截断后的 JSON 文本），tool_start 后立即展示 */
      setArgs(args) {
        argsJson = typeof args === 'string' ? args : JSON.stringify(args, null, 2);
        detail.textContent = [argsText, argsJson ? `入参: ${argsJson}` : ''].filter(Boolean).join('\n');
      },
      done(detailData) {
        el.classList.add('ok');
        label.textContent = `${name} · completed`;
        fill(detailData);
        scrollBottom();
      },
      fail(err, detailData) {
        el.classList.add('err');
        label.textContent = `${name} · failed`;
        fill((err ? err + '\n' : '') + (detailData !== undefined ? (typeof detailData === 'string' ? detailData : JSON.stringify(detailData, null, 2)) : ''));
        scrollBottom();
      },
      skip(reason) {
        el.classList.add('skip');
        label.textContent = `${name} · skipped`;
        if (reason) fill(reason);
        scrollBottom();
      },
    };
  }
  /* ── 思维链折叠块：流式期间展开跟随，完成后自动收起；点击行切换展开 ── */
  function addReasoningBlock(parentEl) {
    const el = document.createElement('div'); el.className = 'tool reasoning streaming open';
    el.innerHTML = `
      <div class="tool-line">
        <span class="tool-label">Thinking</span>
        <span class="tool-caret" aria-hidden="true"><svg viewBox="0 0 14 14" fill="none"><path d="M5 3.5 L9 7 L5 10.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <div class="reasoning-stream"></div>`;
    (parentEl || ensureSeg()).appendChild(el);

    return {

        text += String(delta || '');

        scrollBottom();
      },
      /* 结束：label 定格为 Thought，稍后自动收起（用户手动操作过则维持其选择）。
         幂等：轮次边界 / 工具开始 / 整轮结束多处触发，只生效一次。 */
      done() {
        if (!el.classList.contains('streaming')) return;

  }
  function appendGotoSettings(parent) {    const btn = document.createElement('button');

  /* ── 统一卡壳（Claude/Cursor 式问答框弹窗卡）：卡头可折叠，正文 + 可选详情 + 右下操作区 ──

  function cardShell({ title, bodyHTML, detailText, footHTML }) {

  /* 清单卡公共：计数徽标（已选 M/N 实时刷新） */
  function bindPickCount(el, checkCls) {

  function addPlaceCard(card) {
    const picks = card.picks || [];
    const items = picks.map((p, i) => `
      <div class="pick-item" ${p.reason ? `title="${esc(p.reason)}"` : ''}>
        <input type="checkbox" class="pk-check" data-i="${i}" checked>
        <div class="pi-main">
          <div class="pi-title"><span class="pi-name">${esc(p.name)}</span> <span class="pick-src">${esc(p.src)}</span>${p.reason ? `<span class="pi-reason">${esc(p.reason)}</span>` : ''}</div>
        </div>
        <div class="pi-ctrls">
          <select class="pk-mode" ${p.pageSupport ? '' : 'disabled title="本地库不支持复用模块图页（lib_Cbb.get 崩溃）"'}>
            <option value="page" ${p.mode === 'page' && p.pageSupport ? 'selected' : ''}>复用模块图页</option>

          </select>

    const notes = [];
    if ((card.filtered || []).length) notes.push(`已过滤无效候选：${card.filtered.join('、')}`);
    if (card.notFoundHint) notes.push(card.notFoundHint);
    const el = cardShell({
      title: '放置方案确认',
      bodyHTML: `<div class="pick-list">${items}</div>`
        + (picks.length > 1 ? `<div class="hint">共 ${picks.length} 项，可逐项调整形式与位置。</div>` : ''),

      el.classList.add('dead'); el.classList.remove('open');

      addNote('已取消放置');
      streamAi('好的，已取消。需要我换一批候选吗？', 3);
    };
    el.querySelector('.act-place').onclick = async () => {
      if (busy) return; busy = true;

        busy = false;
        const pages = (res.results || []).filter(r => r.ok && r.pageName).map(r => r.pageName);
        const pageHint = pages.length ? `落在图页 ${[...new Set(pages)].map(n => '**' + n + '**').join('、')}。` : '';
        const fbCnt = (res.results || []).filter(r => r.ok && r.fallbackFromSymbol).length;
        const fbHint = fbCnt ? `\n⚠ 其中 ${fbCnt} 项因**模块未生成符号**（空符号）自动改为图页形式。` : '';

      } catch (e) {

  /* ── 模块描述编辑卡：队列步进式 ──
     相邻到达的多张编辑提案合并为一张卡，一次只展示一个模块（第 1/N 个），
     「写回修改」或「跳过」后自动进入下一个（每个模块仍是独立 token，后端协议不变）；
     全部处理完后整卡折叠并汇总结果。单个提案时外观与旧行为一致。 */
  let editQueue = null;
  function addEditCard(card) {
    const isFirst = !editQueue;
    if (isFirst) {
      const el = cardShell({
        title: '模块描述编辑',
        bodyHTML: '',
        footHTML: `<button class="btn primary act-apply">写回修改</button><span class="spacer"></span>`

      });

      el.querySelector('.act-apply').onclick = applyEditQueueItem;
      el.querySelector('.act-skip').onclick = skipEditQueueItem;
      el.querySelector('.act-skip-all').onclick = skipRestEditQueue;
    }

    if (isFirst) renderEditQueue();
    else updateEditQueueMeta();
  }
  function editQueueBodyHTML(card) {
    return `
        <div class="pick-item" style="display:block">
          <div class="pi-title">${esc(card.origName || card.name)} <span class="pick-src">${esc(card.src)}</span></div>
          ${card.analyzed ? '<span class="pi-reason" style="color:var(--blue)">已按模块自带原理图自动分析生成建议，可直接修改。</span>' : ''}
          <label style="display:block; font-size:11.5px; color:var(--text-3); margin:9px 0 3px;">更新模块名称</label>
          <input type="text" class="em-name" value="${esc(card.name)}" style="width:100%; padding:6px 9px; border:1px solid var(--line); border-radius:7px; font:12.5px/1.5 inherit; font-family:inherit; background:var(--panel); color:var(--text); outline:none;">
          <label style="display:block; font-size:11.5px; color:var(--text-3); margin:8px 0 3px;">更新模块描述</label>
          <textarea class="em-desc" style="width:100%; min-height:84px; resize:vertical; padding:6px 9px; border:1px solid var(--line); border-radius:7px; font:12.5px/1.5 inherit; font-family:inherit; background:var(--panel); color:var(--text); outline:none;">${esc(card.description || '')}</textarea>
        </div>`;
  }
  function renderEditQueue() {
    const q = editQueue; if (!q) return;
    q.el.querySelector('.card-bd').innerHTML = editQueueBodyHTML(q.cards[q.idx]);
    updateEditQueueMeta();
  }
  function updateEditQueueMeta() {
    const q = editQueue; if (!q) return;
    const remaining = q.cards.length - q.idx;
    q.el.querySelector('.hd-status').textContent = q.cards.length > 1 ? `第 ${q.idx + 1}/${q.cards.length} 个` : '';
    q.el.querySelector('.act-skip').textContent = q.cards.length > 1 ? '跳过' : '取消';
    q.el.querySelector('.act-skip-all').style.display = remaining > 1 ? '' : 'none';
  }
  function setEditQueueBusy(b) {
    const q = editQueue; if (!q) return;
    ['act-apply', 'act-skip', 'act-skip-all'].forEach(cls => { const btn = q.el.querySelector('.' + cls); if (btn) btn.disabled = b; });
  }
  function advanceEditQueue() {
    const q = editQueue; if (!q) return;
    q.idx++;
    if (q.idx >= q.cards.length) finishEditQueue();
    else renderEditQueue();
  }
  function finishEditQueue() {
    const q = editQueue; editQueue = null;
    const el = q.el;
    if (el.classList.contains('dead')) return; /* 已被会话失效标记接管，不再重复收尾 */
    if (q.cards.length > 1) el.querySelector('.hd-status').textContent = `写回 ${q.applied} · 跳过 ${q.skipped}`;
    el.classList.add('done'); el.classList.remove('open');
    liveCards.splice(liveCards.indexOf(el), 1);
    if (q.cards.length > 1) {
      streamAi(q.applied > 0
        ? `描述修改处理完成：写回 **${q.applied}** 项${q.skipped ? `，跳过 ${q.skipped} 项` : ''}。到官方库面板刷新后即可看到。`
        : '已跳过全部编辑，未做任何修改。', 3);
    } else if (q.applied > 0) {
      streamAi('已写回修改。到官方库面板刷新后即可看到。', 3);
    }
  }
  async function applyEditQueueItem() {
    const q = editQueue; if (!q || busy || q.el.classList.contains('dead')) return;
    busy = true; setEditQueueBusy(true);
    const card = q.cards[q.idx];
    const payload = {
      libraryUuid: card.libraryUuid, cbbUuid: card.cbbUuid,
      name: q.el.querySelector('.em-name').value, description: q.el.querySelector('.em-desc').value,
    };
    const tb = addToolBubble('edit_module', payload.name);
    try {
      const res = await bridge.confirmEdit(SESSION_ID, card.token, payload);
      res.ok ? tb.done(res) : tb.fail(res.error || '失败', res);
      busy = false; setEditQueueBusy(false);
      if (!res.ok) return; /* 失败留在当前模块，可重试或跳过 */
      q.applied++;
      advanceEditQueue();
    } catch (e) {
      tb.fail(e.message || String(e));
      busy = false; setEditQueueBusy(false); /* 失败留在当前模块 */
    }
  }
  function skipEditQueueItem() {
    const q = editQueue; if (!q || busy || q.el.classList.contains('dead')) return;
    try { bridge.cancelCard(SESSION_ID, q.cards[q.idx].token); } catch (e) {}
    q.skipped++;
    if (q.cards.length === 1) addNote('已取消编辑');
    advanceEditQueue();
  }
  function skipRestEditQueue() {
    const q = editQueue; if (!q || busy || q.el.classList.contains('dead')) return;
    for (let i = q.idx; i < q.cards.length; i++) {
      try { bridge.cancelCard(SESSION_ID, q.cards[i].token); } catch (e) {}
    }
    q.skipped += q.cards.length - q.idx;
    q.idx = q.cards.length;
    finishEditQueue();
  }

      footHTML: `<button class="btn primary act-go">导出 JSON</button><span class="spacer"></span><button class="btn act-cancel">取消</button>`,

        if (!uuids.length) { el.classList.remove('done'); busy = false; addNote('未勾选任何模块'); return; }
        const res = await bridge.confirmExport(SESSION_ID, card.token, uuids);
        if (res.ok) {
          tb.done(res); busy = false;

      } catch (e) {
        tb.fail(e.message || String(e)); busy = false;
      }
    };
  }

  function renderCards(cards) {

  function renderTools(tools, body) {
    (tools || []).forEach(t => {
      const tb = addToolBubble(t.name, t.argsSummary || '', body);
      if (t.status === 'ok') tb.done(t.detail);
      else if (t.status === 'skip') tb.skip(t.error);
      else tb.fail(t.error || '失败', t.detail);
    });

  /* ── 实时事件渲染：sendBtn 在发送中变为停止按钮 ──
     事件流（onAgentEvent）驱动 UI：reasoning/text 增量、工具 Running→完成、卡片即时出现；
     chatTurn 的 Promise resolve（final 快照）只做对账：目录失效标记与去设置入口。 */
  let currentAi = null;      /* 本轮正文气泡（流式 append） */
  let currentReasoning = null; /* 本轮思维链折叠块 */
  let liveTools = [];        /* seqId → 工具行句柄 */
  let currentWork = null;    /* 整轮计时器句柄 */
  let stopRequested = false;

  function setSendAsStop(isStop) {
    sendBtn.classList.toggle('stopping', isStop);
    sendBtn.title = isStop ? '停止生成' : '发送 (Enter)';
    sendBtn.innerHTML = isStop
      ? '<svg viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none"><path d="M12 19V6M12 5l-6.5 6.5M12 5l6.5 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function ensureAiBubble() {
    if (!currentAi) {
      currentAi = addAiBubble();
      currentAi.el.innerHTML = '';
    }
    return currentAi;
  }

  /* 每轮独立渲染上下文：agent 多轮调用（思考→工具→再思考）在 UI 上按轮分段，
     轮次边界可见，不再把所有轮次拼进同一个思考块/气泡。 */
  let currentRound = -1;

  function ensureRoundContext(round) {
    if (currentRound === round) return;
    /* 进入新一轮 = 上一轮的思考已结束：把上一轮 Thinking 定格为 Thought */
    if (currentReasoning) currentReasoning.done();
    currentRound = round;
    currentReasoning = null;
    currentAi = null;
    /* liveTools 不重置：后端 seqId 按整轮全局递增，前端数组必须与之一一对应 */
  }

  function handleAgentEvent(ev) {
    if (ev.type === 'reasoning_delta') {
      ensureRoundContext(ev.round);
      if (!currentReasoning) currentReasoning = addReasoningBlock(workBody());
      currentReasoning.append(ev.delta);
      return;
    }
    if (ev.type === 'text_delta') {
      ensureRoundContext(ev.round);
      const b = ensureAiBubble();
      b.text += ev.delta;
      b.el.innerHTML = mdRich(b.text);
      scrollBottom();
      return;
    }
    if (ev.type === 'tool_start') {
      ensureRoundContext(ev.round);
      /* 模型发起工具调用 = 本轮思考结束：定格 Thinking → Thought */
      if (currentReasoning) currentReasoning.done();
      /* tool_start 与 tool_end 通过数组下标（seqId）对位；args = 模型真实入参 JSON */
      const tb = addToolBubble(ev.name, ev.argsSummary || '', workBody());
      if (ev.args !== undefined) tb.setArgs(ev.args);
      liveTools.push(tb);
      return;
    }
    if (ev.type === 'tool_end') {
      const tb = liveTools[ev.seqId];
      if (!tb) return;
      const t = ev.event;
      /* detail = 工具真实执行结果 JSON（后端已截断）；失败时展示 error + 参数 */
      if (t.status === 'ok') tb.done(t.detail);
      else if (t.status === 'skip') tb.skip(t.error || '已跳过');
      else tb.fail(t.error || '失败', t.detail);
      return;
    }
    if (ev.type === 'round_end') {
      ensureRoundContext(ev.round);
      return;
    }
    if (ev.type === 'card') {
      renderCards([ev.card]);
      return;
    }
    if (ev.type === 'final') {
      /* final 快照对账：卡片失效由目录刷新检测驱动；正文/工具已实时渲染，不再重画 */
      const res = ev.result;
      if ((res.tools || []).some(x => x.name === 'refresh_catalog'))
        invalidateCards('目录已更新');
      if (res.error && res.error.kind === 'aborted') {
        if (currentAi && !currentAi.text) { currentAi.el.innerHTML = '<i>（已停止）</i>'; }
        addNote('已停止本轮回复');
        return;
      }
      if (res.error && res.error.gotoSettings) {
        const b = ensureAiBubble();
        appendGotoSettings(b.el.parentElement);
      }
      /* 极少数端点错误时 assistantText 未经过增量（recovery 话术）：补渲染 */
      if (res.error && !currentAi) {
        const b = addAiBubble();
        b.el.innerHTML = mdRich(res.assistantText || '');
        scrollBottom();
      }
    }
  }

  function workBody() { return currentWork ? currentWork.body : null; }

  async function handleUser(text) {
    const t = String(text || '').trim();
    if (!t || busy) return;
    busy = true;
    stopRequested = false;
    syncSendState();
    setSendAsStop(true);
    addUserMsg(t);
    markCardsRisk();
    currentWork = addWorkTimer();
    currentAi = null; currentReasoning = null; liveTools = []; currentRound = -1;
    try {
      if (typeof bridge.onAgentEvent === 'function') {
        bridge.onAgentEvent(SESSION_ID, handleAgentEvent);
        await bridge.chatTurn(SESSION_ID, t);
      } else {
        /* 旧桥（无事件通道）：退回整批渲染 */
        const res = await bridge.chatTurn(SESSION_ID, t);
        if ((res.tools || []).some(x => x.name === 'refresh_catalog'))
          invalidateCards('目录已更新');
        renderTools(res.tools, work.body);
        await streamAi(res.assistantText || '', 3);
        if (res.gotoSettings || (res.error && res.error.gotoSettings))
          appendGotoSettings(document.querySelector('.col.ai:last-child') || work.body);
        renderCards(res.cards);
      }
    } catch (e) {
      addNote('会话出现异常：' + (e.message || e));
    }
    if (currentReasoning) currentReasoning.done();
    busy = false;
    stopRequested = false;
    setSendAsStop(false);
    syncSendState();
    currentWork.done();
    currentAi = null; currentReasoning = null; liveTools = []; currentRound = -1;
  }

  /* 建议项点击：只把文案填入输入框，不自动发送——由用户确认后回车或点发送键才真正发出 */
  function fillComposer(text) {

  CHIP_PROMPTS.forEach(c => { /* 空会话首屏（#chips，居中换行）与对话中建议条（#chipsBar，横滑）共用同一组选项 */
    /* 注意：cloneNode 不复制事件监听器，两处必须各自绑定 onclick（此前 chipsBar 的克隆节点不可点击） */
    const b1 = document.createElement('div'); b1.className = 'chip'; b1.textContent = c;

  /* 建议条滚轮横滑：滚轮增量优先横向滚动本栏（始终精确到 0 / max，不会截断），
     超出部分转交上方消息区，避免边缘死区与对话流误滚 */
  $('#chipsBar').addEventListener('wheel', e => {
    const el = e.currentTarget;
    const max = el.scrollWidth - el.clientWidth;
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (max <= 0) { msgList.scrollTop += delta; return; }
    e.preventDefault();
    const clamped = Math.max(0, Math.min(max, el.scrollLeft + delta));
    const consumed = clamped - el.scrollLeft;
    el.scrollLeft = clamped;
    const leftover = delta - consumed;
    if (Math.abs(leftover) > 0.5) msgList.scrollTop += leftover;
  }, { passive: false });

  const input = $('#input');

    input.style.height = 'auto';

  function catalogAge(ms) {
    if (!ms) return '';
    const age = Date.now() - ms;
    if (age < 60_000) return '刚刚拉取';
    if (age < 3_600_000) return `${Math.floor(age / 60_000)} 分钟前拉取`;
    if (age < 86_400_000) return `${Math.floor(age / 3_600_000)} 小时前拉取`;

  async function renderCatalogAdmin() {
    const status = $('#catalogStatus');
    const list = $('#catalogLibs');
    if (!status || !list || typeof bridge.getCatalogAdmin !== 'function') return;
    let view;
    try { view = await bridge.getCatalogAdmin(); }
    catch (e) {
      status.textContent = '模块库目录读取失败。';
      list.innerHTML = '';
      return;
    }
    if (!view || view.empty) {
      status.textContent = '尚未拉取模块库目录。';
      list.innerHTML = '';
      return;
    }
    status.textContent = `${view.libraries.length} 个库 · ${view.moduleCount} 个模块 · ${catalogAge(view.fetchedAt)}`;
    list.innerHTML = (view.libraries || []).map(lib => `
      <label class="scoperow">
        <input type="checkbox" data-key="${esc(lib.key)}" ${lib.visible ? 'checked' : ''}>
        <b>${esc(lib.name || lib.key)}</b>
        <span class="scope-badge ${lib.failed ? 'bad' : 'ok'}">${lib.failed ? '拉取失败' : lib.modules + ' 个模块'}</span>

      r.textContent = '还没有可保存的库，请先重新拉取。';

    if (typeof bridge.saveHiddenLibraryKeys !== 'function') {
      r.className = 'opresult err';

    }
    try {
      bridge.saveHiddenLibraryKeys(boxes.filter(box => !box.checked).map(box => box.dataset.key));
      await refreshSettingsPage();
      r.className = 'opresult ok';
      r.textContent = '可见范围已保存，下一条消息生效。';
    } catch (e) {
      r.className = 'opresult err';
      r.textContent = '保存失败：' + (e.message || String(e));
    }
  };
  let importPayload = null;
  function closeImportReview() {
    importPayload = null;
    const mask = $('#importMask');
    if (mask) mask.hidden = true;
    const file = $('#catalogFile');
    if (file) file.value = '';
  }
  function importSampleList(title, items, total) {
    if (!items || !items.length) return '';
    const lis = items.map(it => `<li>${esc(it.library)} / ${esc(it.name || it.uuid)}${it.fields && it.fields.length ? ' · ' + esc(it.fields.join('、')) : ''}</li>`).join('');
    const more = total > items.length ? `<div class="pnote">还有 ${total - items.length} 条未列出。</div>` : '';
    return `<div class="import-block"><b>${title}</b><ul>${lis}</ul>${more}</div>`;
  }
  function showImportPreview(fileName, preview) {
    $('#importFileName').textContent = fileName;
    const bits = [
      `相同 ${preview.identical}`,
      `冲突 ${preview.conflicts}`,
      `文件多出 ${preview.added}`,
      `文件没有 ${preview.missing}`,
    ];
    if (preview.fileDuplicates) bits.push(`文件内重复 ${preview.fileDuplicates}（同库同 uuid 取最后一条）`);
    if (preview.invalid) bits.push(`无效 ${preview.invalid}`);
    if (preview.skippedFailedLibraries) bits.push(`跳过失败空库 ${preview.skippedFailedLibraries}`);
    if (preview.untouchedLibraries) bits.push(`未涉及的库 ${preview.untouchedLibraries}`);
    $('#importCounts').innerHTML = bits.map(t => `<span>${esc(t)}</span>`).join('');
    $('#importLists').innerHTML = [
      importSampleList('内容冲突', preview.samples.conflicts, preview.conflicts),
      importSampleList('文件里多出来的', preview.samples.added, preview.added),
      importSampleList('同一库里文件没有的', preview.samples.missing, preview.missing),
    ].join('');
    const result = $('#importResult');
    result.className = '';
    result.textContent = '';
    $('#importMask').hidden = false;
    const apply = $('#importApply');
    if (apply) apply.disabled = false;
  }
  $('#btnImportCatalog').onclick = () => {
    const r = $('#catalogResult');
    if (typeof bridge.previewCatalogImport !== 'function') {
      r.className = 'opresult err';
      r.textContent = '当前版本不能导入目录。';
      return;
    }
    $('#catalogFile').click();
  };
  $('#catalogFile').onchange = async () => {
    const file = $('#catalogFile').files && $('#catalogFile').files[0];
    const r = $('#catalogResult');
    if (!file) return;
    r.className = 'opresult wait';
    r.textContent = '正在对照当前目录…';
    try {
      const raw = JSON.parse(await file.text());
      const res = await bridge.previewCatalogImport(raw);
      if (!res || !res.ok || !res.preview) {
        r.className = 'opresult err';
        r.textContent = (res && res.error) || '无法读取这份目录';
        $('#catalogFile').value = '';
        return;
      }
      importPayload = raw;
      r.className = '';
      r.textContent = '';
      showImportPreview(file.name, res.preview);
    } catch (e) {
      r.className = 'opresult err';
      r.textContent = '不是合法的 JSON：' + (e.message || String(e));
      $('#catalogFile').value = '';
    }
  };
  $('#importCancel').onclick = () => closeImportReview();
  $('#importApply').onclick = async () => {
    const r = $('#importResult');
    if (!importPayload || typeof bridge.applyCatalogImport !== 'function') {
      r.className = 'opresult err';
      r.textContent = '没有可合并的目录。';
      return;
    }
    const btn = $('#importApply');
    btn.disabled = true;
    r.className = 'opresult wait';
    r.textContent = '正在写入目录…';
    try {
      const res = await bridge.applyCatalogImport(importPayload, {
        onConflict: $('#importConflict').value,
        onAdded: $('#importAdded').value,
        onMissing: $('#importMissing').value,
      });
      if (!res || !res.ok) {
        r.className = 'opresult err';
        r.textContent = (res && res.error) || '导入失败';
        btn.disabled = false;
        return;
      }
      closeImportReview();
      await refreshSettingsPage();
      const out = $('#catalogResult');
      out.className = 'opresult ok';
      const parts = [`目录现有 ${res.libraries ?? 0} 个库、${res.modules ?? 0} 个模块`];
      if (res.added) parts.push(`加入 ${res.added}`);
      if (res.conflictsImported) parts.push(`冲突采用文件 ${res.conflictsImported}`);
      if (res.conflictsKept) parts.push(`冲突保留现有 ${res.conflictsKept}`);
      if (res.missingDropped) parts.push(`移除 ${res.missingDropped}`);
      if (res.missingKept) parts.push(`文件没有但保留 ${res.missingKept}`);
      out.textContent = parts.join('，') + '。';
    } catch (e) {
      r.className = 'opresult err';
      r.textContent = e.message || String(e);
      btn.disabled = false;
    }
  };
  $('#btnRefreshCatalog').onclick = async () => {
    const r = $('#catalogResult');
    const btn = $('#btnRefreshCatalog');
    if (typeof bridge.refreshCatalogNow !== 'function') {
      r.className = 'opresult err'; r.textContent = '当前版本不能在设置里重新拉取。';
      return;
    }
    btn.disabled = true; btn.textContent = '拉取中…';
    const saveBtn = $('#btnSaveCatalogVis');
    const importBtn = $('#btnImportCatalog');
    const exportBtn = $('#btnExportCatalog');
    if (saveBtn) saveBtn.disabled = true;
    if (importBtn) importBtn.disabled = true;
    if (exportBtn) exportBtn.disabled = true;
    r.className = 'opresult wait';
    r.textContent = '拉取数据可能需要数分钟，请您耐心等待。';
    try {
      const res = await bridge.refreshCatalogNow();
      if (res && res.ok) {
        await refreshSettingsPage();
        r.className = 'opresult ok';
        r.textContent = `已拉取 ${res.libraries ?? 0} 个库、${res.modules ?? 0} 个模块。`;
      } else {
        r.className = 'opresult err';
        r.textContent = (res && res.error) || '拉取失败';
      }
    } catch (e) {
      r.className = 'opresult err';
      r.textContent = e.message || String(e);
    }
    btn.disabled = false; btn.textContent = '重新拉取';
    if (saveBtn) saveBtn.disabled = false;
    if (importBtn) importBtn.disabled = false;
    if (exportBtn) exportBtn.disabled = false;
  };

  $('#btnExportCatalog').onclick = async () => {
    const r = $('#catalogResult');
    const btn = $('#btnExportCatalog');
    const keys = [...$('#catalogLibs').querySelectorAll('input[data-key]:checked')].map(box => box.dataset.key);
    if (!keys.length) {
      r.className = 'opresult err';
      r.textContent = '请先勾选要导出的库。';
      return;
    }
    if (typeof bridge.exportCatalog !== 'function') {
      r.className = 'opresult err';
      r.textContent = '当前版本不能在设置里导出目录。';
      return;
    }
    btn.disabled = true;
    r.className = 'opresult wait';
    r.textContent = '正在准备勾选的库…';
    try {
      const res = await bridge.exportCatalog(keys);
      if (res && res.ok && !res.cancelled) {
        r.className = 'opresult ok';
        r.textContent = `已导出 ${res.libraries ?? 0} 个库、${res.modules ?? 0} 个模块到 ${res.fileName}。未勾选的库没有写入。`;
      } else if (res && res.cancelled) {
        r.className = '';
        r.textContent = '';
      } else {
        r.className = 'opresult err';
        r.textContent = (res && res.error) || '导出失败';
      }
    } catch (e) {
      r.className = 'opresult err';
      r.textContent = e.message || String(e);
    }
    btn.disabled = false;
  };

  $('#saveSettings').onclick = async () => {
    try {
      bridge.saveLlmSettings({ provider: $('#setFormat').value, baseUrl: $('#setBase').value, apiKey: $('#setKey').value, model: $('#setModel').value });
      if (typeof bridge.savePlacementSettings === 'function') {
        const hex = v => (/^#[0-9a-fA-F]{6}$/.test(String(v).trim()) ? String(v).trim() : '');
        const num = (v, min) => (Number.isFinite(+v) && +v > (min || 0) ? +v : null);
        bridge.savePlacementSettings({
          gapX: +$('#setGapX').value > 0 ? +$('#setGapX').value : 80,
          gapY: +$('#setGapY').value > 0 ? +$('#setGapY').value : 80,
          borderColor: hex($('#setBorderColor').value),
          borderWidth: num($('#setBorderWidth').value, 0),
          margin: Number.isFinite(+$('#setMargin').value) && +$('#setMargin').value >= 0 ? +$('#setMargin').value : 40,
        });
      }
      renderStatus();
      await refreshSettingsPage();
      const r = $('#connResult'); r.className = 'opresult ok'; r.textContent = '✅ 设置已保存（双写）。放置排布设置下次放置生效。';
    } catch (e) {
      const r = $('#connResult'); r.className = 'opresult err'; r.textContent = '保存失败：' + e.message;
    }
  };
  $('#testConn').onclick = async () => {
    const r = $('#connResult'); r.className = '';
    const btn = $('#testConn'); btn.disabled = true; btn.textContent = '测试中…';
    try {
      const res = await bridge.testConnection();
      r.className = res.ok ? 'opresult ok' : 'opresult err';
      r.textContent = res.ok ? `✅ 连接成功：${res.model} · ${res.latencyMs}ms` : `❌ ${res.error}`;
    } catch (e) {
      r.className = 'opresult err'; r.textContent = '❌ ' + e.message;
    }
    btn.disabled = false; btn.textContent = '测试连接';
  };
  function resetChat() {
    if (!confirm('清空当前对话？（目录与设置不受影响）')) return;
    try { bridge.resetChatSession(SESSION_ID); } catch (e) {}
    msgList.innerHTML = ''; liveCards.length = 0; curSeg = null;
    $('#page-chat').classList.add('empty'); /* 恢复空会话首屏 */
    switchTab('chat');
  }
  $('#clearChatBtn').onclick = resetChat;
})();
</script>
</body>
</html>
